import net.neoforged.gradle.userdev.runtime.tasks.ClasspathSerializer

plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

ext.platformLoader = 'neoforge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'JEI'
                url = providers.gradleProperty('jeiRepository').orElse('https://maven.blamejared.com').get()
            }
        }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup('software.bernie.geckolib') }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

runs {
    configureEach {
        workingDirectory layout.projectDirectory.dir('run').dir(name)
        modSource sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}

tasks.withType(ClasspathSerializer).configureEach { serializer ->
    // NeoGradle writes absolute paths even though its input fingerprint ignores paths.
    serializer.inputs.files(serializer.inputFiles)
            .withPropertyName('absoluteClasspathLocations')
            .withPathSensitivity(PathSensitivity.ABSOLUTE)
}
