import net.neoforged.gradle.userdev.runtime.tasks.ClasspathSerializer

plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

ext.platformLoader = 'neoforge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'JEI'
                url = providers.gradleProperty('jeiRepository').orElse('https://maven.blamejared.com').get()
            }
        }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup('software.bernie.geckolib') }
    }
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('storageCompatRepository').orElse('https://api.modrinth.com/maven').get() }
        }
        filter {
            includeModule('maven.modrinth', 'patchouli')
            includeModule('maven.modrinth', 'create')
            includeModule('maven.modrinth', 'refined-storage')
            includeModule('maven.modrinth', 'sophisticated-backpacks')
            includeModule('maven.modrinth', 'sophisticated-core')
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('storageCompatRepository').orElse('https://maven.createmod.net').get() }
        }
        filter { includeModule('net.createmod.ponder', 'ponder-neoforge') }
    }
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('storageCompatRepository').orElse('https://www.cursemaven.com').get() }
        }
        filter { includeModule('curse.maven', 'iron-chests-228756') }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${loader_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly('org.apiguardian:apiguardian-api:1.1.2')
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    compileOnly('maven.modrinth:patchouli:BIogJv2D') { transitive = false }
    compileOnly('maven.modrinth:create:UjX6dr61') { transitive = false }
    compileOnly('maven.modrinth:refined-storage:lHHiI26k') { transitive = false }
    compileOnly('maven.modrinth:sophisticated-backpacks:8YikAvYD') { transitive = false }
    compileOnly('maven.modrinth:sophisticated-core:URsV4WGl') { transitive = false }
    compileOnly('curse.maven:iron-chests-228756:5491156') { transitive = false }
}

runs {
    configureEach {
        workingDirectory layout.projectDirectory.dir('run').dir(name)
        modSource sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}

apply from: '../../gradle/bladder.gradle'

apply from: '../../gradle/field-guide.gradle'

tasks.withType(ClasspathSerializer).configureEach { serializer ->
    // NeoGradle writes absolute paths even though its input fingerprint ignores paths.
    serializer.inputs.files(serializer.inputFiles)
            .withPropertyName('absoluteClasspathLocations')
            .withPathSensitivity(PathSensitivity.ABSOLUTE)
}
