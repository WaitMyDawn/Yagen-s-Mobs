modLoader="javafml"
loaderVersion="${fml_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/yagens_mobs/icon.png"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${loader_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},5)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="yagens_mobs.mixins.json"

[[mixins]]
config="yagens_mobs.lumen_butterfly.mixins.json"

[[mixins]]
config="yagens_mobs.salvage.mixins.json"

[[mixins]]
config="yagens_mobs.weasel.mixins.json"
