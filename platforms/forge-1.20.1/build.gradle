buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'
ext.platformLoader = 'forge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}" }

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory file("run/${name}")
            mods { create(mod_id) { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

tasks.named('jar') {
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    manifest.attributes 'MixinConfigs': 'yagens_mobs.mixins.json,yagens_mobs.lumen_butterfly.mixins.json,yagens_mobs.salvage.mixins.json,yagens_mobs.weasel.mixins.json'
    finalizedBy 'reobfJar'
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('geckolibRepository').orElse('https://api.modrinth.com/maven').get() }
        }
        filter { includeVersion('maven.modrinth', 'geckolib', geckolib_artifact) }
    }
}
dependencies { implementation fg.deobf("maven.modrinth:geckolib:${geckolib_artifact}") }

tasks.named('processResources') {
    from('../neoforge-1.21.1/src/main/resources') {
        include 'assets/**', 'data/yagens_mobs/worldgen/**/salvage_ray*.json', 'data/yagens_mobs/tags/worldgen/biome/salvage_ray_nests.json'
        include 'data/yagens_mobs/tags/worldgen/biome/snowcache_weasel_spawns.json'
    }
}

jarJar.enable()
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}
mixin {
    add sourceSets.main, 'yagens_mobs.refmap.json'
    config 'yagens_mobs.mixins.json'
    config 'yagens_mobs.lumen_butterfly.mixins.json'
    config 'yagens_mobs.salvage.mixins.json'
    config 'yagens_mobs.weasel.mixins.json'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    from file('../../LICENSE.md')
    manifest.attributes 'MixinConfigs': 'yagens_mobs.mixins.json,yagens_mobs.lumen_butterfly.mixins.json,yagens_mobs.salvage.mixins.json,yagens_mobs.weasel.mixins.json'
    finalizedBy 'reobfJarJar'
}
tasks.named('build') { dependsOn 'jarJar' }
tasks.withType(JavaCompile).configureEach { options.release = 17 }

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('jeiRepository').orElse('https://maven.blamejared.com').get() }
        }
                filter {
            includeVersionByRegex('mezz[.]jei', 'jei-1[.]20[.]1-.*', java.util.regex.Pattern.quote(jei_version))
        }
    }
}
dependencies {
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }
    }
}

repositories {
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://api.modrinth.com/maven').get()
        content { includeGroup('maven.modrinth') }
    }
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://maven.createmod.net').get()
        content { includeGroup('net.createmod.ponder') }
    }
}

dependencies {
    compileOnly(fg.deobf('maven.modrinth:iron-chests:YjbOtYwN')) { transitive = false }
    compileOnly(fg.deobf('maven.modrinth:sophisticated-backpacks:kHCIrzhV')) { transitive = false }
    compileOnly(fg.deobf('maven.modrinth:sophisticated-core:45N2w0YX')) { transitive = false }
    compileOnly(fg.deobf('maven.modrinth:refined-storage:ZITLFjjf')) { transitive = false }
    compileOnly(fg.deobf('maven.modrinth:create:8amzvn9x')) { transitive = false }
    compileOnly(fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')) { transitive = false }
}
