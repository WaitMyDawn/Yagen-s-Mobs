plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

ext.platformLoader = 'fabric'
apply from: '../../gradle/platform.gradle'

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation commonProject.sourceSets.main.output
    implementation 'com.electronwill.night-config:core:3.8.3'
    implementation 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:core:3.8.3'
    include 'com.electronwill.night-config:toml:3.8.3'
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
        }
    }
    runs {
        client { runDir 'run/client'; ideConfigGenerated true }
        server { runDir 'run/server'; ideConfigGenerated true }
    }
}

tasks.named('jar') { from commonProject.sourceSets.main.output }

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('geckolibRepository').orElse('https://api.modrinth.com/maven').get() }
        }
        filter { includeModule('maven.modrinth', 'geckolib') }
    }
}
dependencies { modImplementation "maven.modrinth:geckolib:${geckolib_artifact}" }

tasks.named('processResources') {
    from('../neoforge-1.21.1/src/main/resources') {
        include 'data/yagens_mobs/tags/worldgen/biome/collector/**'
        include 'assets/**', 'data/yagens_mobs/**/salvage_ray*.json', 'data/yagens_mobs/loot_table/blocks/salvage_nest_box.json'
        include 'data/yagens_mobs/tags/worldgen/biome/snowcache_weasel_spawns.json'
        include 'data/yagens_mobs/tags/worldgen/biome/kavat_adjusted_habitat.json'
        include 'data/yagens_mobs/tags/worldgen/biome/kavat_reduced_habitat.json'
        include 'data/yagens_mobs/tags/worldgen/biome/condroc_ravine_exclusions.json'
        include 'data/yagens_mobs/tags/worldgen/biome/kavat_habitat.json', 'data/yagens_mobs/loot_table/blocks/kavat_incubator.json'
        include 'data/yagens_mobs/tags/item/kavat_raw_meat.json', 'data/yagens_mobs/tags/item/kavat_cooked_meat.json'
        include 'data/minecraft/tags/block/mineable/pickaxe.json'
        exclude 'assets/yagens_mobs/models/item/*_spawn_egg.json'
        includeEmptyDirs = false
        eachFile { asset ->
            asset.path = asset.path.replaceFirst('^assets/yagens_mobs/geo/', 'assets/yagens_mobs/geckolib/models/')
                    .replaceFirst('^assets/yagens_mobs/animations/', 'assets/yagens_mobs/geckolib/animations/')
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('jeiRepository').orElse('https://maven.blamejared.com').get() }
        }
        filter { includeGroup('mezz.jei') }
    }
}
dependencies {
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    }
}


repositories {
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://api.modrinth.com/maven').get()
        content { includeGroup('maven.modrinth') }
    }
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://www.cursemaven.com').get()
        content { includeGroup('curse.maven') }
    }
}

dependencies {
    modCompileOnly('curse.maven:ironchest-498534:7536130') { transitive = false }
    modCompileOnly('maven.modrinth:create-fly:fn0H9rSj') { transitive = false }
}

apply from: '../../gradle/field-guide.gradle'


dependencies {
    modCompileOnly('curse.maven:patchouli-fabric-edition-1664943:8713841') { transitive = false }
    if (providers.gradleProperty('withPatchouli').isPresent()) {
        modRuntimeOnly('curse.maven:patchouli-fabric-edition-1664943:8713841') { transitive = false }
        // Loom strips nested jars during dev remapping. The release distribution already bundles Fiber.
        def distribution = configurations.detachedConfiguration(project.dependencies.create('curse.maven:patchouli-fabric-edition-1664943:8713841'))
        modRuntimeOnly(files(zipTree(distribution.singleFile).matching { include 'META-INF/jars/fiber-*.jar' }))
    }
}

apply from: '../../gradle/bladder.gradle'
apply from: '../../gradle/gathering.gradle'
apply from: '../../gradle/collector-pools.gradle'
