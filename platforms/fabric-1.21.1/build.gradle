plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

ext.platformLoader = 'fabric'
apply from: '../../gradle/platform.gradle'

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation commonProject.sourceSets.main.output
    implementation 'com.electronwill.night-config:core:3.8.3'
    implementation 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:core:3.8.3'
    include 'com.electronwill.night-config:toml:3.8.3'
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
        }
    }
    runs {
        client { runDir 'run/client'; ideConfigGenerated true }
        server { runDir 'run/server'; ideConfigGenerated true }
    }
}

tasks.named('jar') { from commonProject.sourceSets.main.output }

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('geckolibRepository').orElse('https://api.modrinth.com/maven').get() }
        }
        filter { includeModule('maven.modrinth', 'geckolib') }
    }
}
dependencies { modImplementation "maven.modrinth:geckolib:${geckolib_artifact}" }

// Vanilla source is shared at the same Minecraft ABI. Fabric files replace loader-specific
// registrations or hooks by path before the common gameplay code is compiled.
def reference = file('../neoforge-1.21.1/src/main')
def overlays = file('src/main/java')
def replacedSources = fileTree(overlays).matching { include '**/*.java' }.files.collect {
    overlays.toPath().relativize(it.toPath()).toString().replace('\\', '/')
}
def stageReferenceSources = tasks.register('stageReferenceSources', Sync) {
    from('../fabric-1.21.11/src/main/java') {
        include '**/weasel/FabricSlotInventory.java', '**/guide/client/PatchouliReader.java'
    }
    // Fabric's field guide uses the static gallery and its list-based discovery packet.
    from(new File(reference, 'java')) {
        exclude '**/yagens_mobs/guide/**', '**/entity/collector/client/CollectorCatalog.java'
        exclude '**/mixin/BladderWaterContact.java', '**/bubblesalamander/client/BladderClient.java',
                '**/bubblesalamander/client/ConnectedBladderModel.java'
    }
    exclude replacedSources
    exclude '**/weasel/NeoPhysicalStorage.java', '**/weasel/NeoRefinedStorage.java', '**/weasel/NeoCreateStorage.java'
    exclude '**/weasel/mixin/WeaselCreateFunnelOutput.java'
    exclude '**/weasel/WeaselPortPackets.java', '**/weasel/client/WeaselPortScreen.java'
    into layout.buildDirectory.dir('generated/reference/java')
}
sourceSets.main.java.srcDir(stageReferenceSources)
idea.module.generatedSourceDirs += layout.buildDirectory.dir('generated/reference/java').get().asFile

tasks.named('processResources') {
    from new File(reference, 'resources'), {
        exclude 'data/yagens_mobs/tags/item/collector/**'
        include 'assets/**', 'data/**'
        exclude 'data/yagens_mobs/recipe/recipe_blueprint.json', 'data/yagens_mobs/recipe/field_guide.json'
        exclude '**/neoforge/**'
    }
}
loom {
    accessWidenerPath = file('src/main/resources/yagens_mobs.accesswidener')
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = providers.gradleProperty('jeiRepository').orElse('https://maven.blamejared.com').get() }
        }
        filter { includeGroup('mezz.jei') }
    }
}
dependencies {
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    }
}


repositories {
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://api.modrinth.com/maven').get()
        content { includeGroup('maven.modrinth') }
    }
    maven {
        url = providers.gradleProperty('storagePortRepository').orElse('https://www.cursemaven.com').get()
        content { includeGroup('curse.maven') }
    }
}

dependencies {
    modCompileOnly('curse.maven:ironchest-498534:5782222') { transitive = false }
    modCompileOnly('maven.modrinth:refined-storage:PMoDGaFz') { transitive = false }
    modCompileOnly('maven.modrinth:sophisticated-backpacks-unoffical-fabric-port:nHhuPdda') { transitive = false }
    modCompileOnly('maven.modrinth:sophisticated-core-unofficial-fabric-port:ZLVrtF0Q') { transitive = false }
}

apply from: '../../gradle/field-guide.gradle'

dependencies {
    modCompileOnly('maven.modrinth:patchouli:XIjNwQkI') { transitive = false }
    if (providers.gradleProperty('withPatchouli').isPresent()) {
        modRuntimeOnly('maven.modrinth:patchouli:XIjNwQkI') { transitive = false }
        // Loom strips nested jars during dev remapping. The release distribution already bundles Fiber.
        def distribution = configurations.detachedConfiguration(project.dependencies.create('maven.modrinth:patchouli:XIjNwQkI'))
        modRuntimeOnly(files(zipTree(distribution.singleFile).matching { include 'META-INF/jars/fiber-*.jar' }))
    }
}

apply from: '../../gradle/bladder.gradle'
apply from: '../../gradle/gathering.gradle'
apply from: '../../gradle/collector-pools.gradle'
